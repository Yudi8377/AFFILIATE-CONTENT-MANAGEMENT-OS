name: Deploy public site to GitHub Pages

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required static files
        run: |
          test -s index.html
          test -s assets/css/site.css
          test -s assets/js/app.js
          test -s assets/favicon.svg
          test -s robots.txt
          test -s sitemap.xml
          grep -q 'name="description"' index.html
          grep -q 'rel="canonical"' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'LOCAL PREVIEW' index.html
          ! grep -R -E '(DATABASE_URL|NEON_API_KEY|OPENAI_API_KEY|sk-[A-Za-z0-9]{20,})' index.html assets
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
      - name: Check public SEO routes are not exposing app-only paths
        run: |
          grep -q 'Sitemap: https://yudi8377.github.io/AFFILIATE-CONTENT-MANAGEMENT-OS/sitemap.xml' robots.txt
          grep -q 'AFFILIATE-CONTENT-MANAGEMENT-OS/' sitemap.xml
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public artifact without repository docs or migrations
        run: |
          mkdir -p dist/assets/css dist/assets/js
          cp index.html robots.txt sitemap.xml dist/
          cp assets/favicon.svg dist/assets/
          cp assets/css/site.css dist/assets/css/
          cp assets/js/app.js dist/assets/js/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
