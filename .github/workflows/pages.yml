name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'admin.html'
      - 'privacy.html'
      - 'disclosure.html'
      - 'package.json'
      - 'vite.config.js'
      - 'database/**'
      - 'scripts/**'
      - 'tests/**'
      - 'neon/functions/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/branch-checks.yml'
      - '.github/workflows/publish-cms.yml'
      - 'assets/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps
      - name: Validate required static files
        env:
          VITE_NEON_AUTH_URL: https://ep-little-field-aomzop7h.neonauth.c-2.ap-southeast-1.aws.neon.tech/neondb/auth
          VITE_NEON_DATA_API_URL: https://ep-little-field-aomzop7h.apirest.c-2.ap-southeast-1.aws.neon.tech/neondb/rest/v1
        run: |
          test -s index.html
          test -s product-intelligence.html
          test -s seo-content.html
          test -s content-studio.html
          test -s campaign-operations.html
          test -s cost-governance.html
          test -s assets/css/site.css
          test -s assets/js/app.js
          test -s assets/favicon.svg
          test -s robots.txt
          test -s sitemap.xml
          grep -q 'name="description"' index.html
          grep -q 'rel="canonical"' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'compression-hero' index.html
          grep -q 'compression-panel' index.html
          grep -q 'panel-studio' index.html
          grep -q 'panel-campaign' index.html
          ! grep -q 'product-intelligence.html' index.html
          ! grep -q 'seo-content.html' index.html
          ! grep -q 'cost-governance.html' index.html
          grep -q 'password-reset-request-form' app.html
          grep -q 'password-visibility' assets/js/workspace.js
          grep -q 'requestPasswordReset' assets/js/workspace.js
          grep -q 'resetPassword' assets/js/workspace.js
          ! grep -R -E '(DATABASE_URL|NEON_API_KEY|OPENAI_API_KEY|sk-[A-Za-z0-9]{20,})' index.html assets
      - name: Check JavaScript syntax and production build
        env:
          VITE_NEON_AUTH_URL: https://ep-little-field-aomzop7h.neonauth.c-2.ap-southeast-1.aws.neon.tech/neondb/auth
          VITE_NEON_DATA_API_URL: https://ep-little-field-aomzop7h.apirest.c-2.ap-southeast-1.aws.neon.tech/neondb/rest/v1
        run: |
          npm run check
          npm test
          npm run build
          cp robots.txt sitemap.xml dist/
          npm run generate:public
          test -s dist/index.html
          test -s dist/app.html
          test -s dist/admin.html
          test -s dist/privacy.html
          test -s dist/disclosure.html
          test -s dist/product-intelligence.html
          test -s dist/seo-content.html
          test -s dist/content-studio.html
          test -s dist/campaign-operations.html
          test -s dist/cost-governance.html
          test -s dist/articles/index.html
          test -s dist/products/index.html
          grep -q 'noindex,nofollow,noarchive' dist/app.html
          grep -q 'noindex,nofollow,noarchive' dist/admin.html
          grep -R -q 'admin-shell' dist/assets/*.css
          test "$(grep -c 'CREATE TABLE IF NOT EXISTS public\.' database/migrations/0001_core_schema.sql)" -eq 12
          test "$(grep -c 'ENABLE ROW LEVEL SECURITY' database/migrations/0001_core_schema.sql)" -eq 12
          test "$(grep -c 'CREATE POLICY' database/migrations/0002_rls_policies.sql)" -eq 39
          test "$(grep -c 'CREATE TABLE IF NOT EXISTS public\.' database/migrations/0003_business_modules_and_public_cms.sql)" -eq 15
          test "$(grep -c 'ENABLE ROW LEVEL SECURITY' database/migrations/0003_business_modules_and_public_cms.sql)" -eq 15
          test "$(grep -c 'CREATE POLICY' database/migrations/0003_business_modules_and_public_cms.sql)" -eq 59
          test "$(grep -c 'DROP POLICY IF EXISTS' database/migrations/0004_license_write_hardening.sql)" -eq 3
          test "$(grep -c 'CREATE POLICY' database/migrations/0005_platform_admin_policies.sql)" -eq 15
          grep -q "keyword-cluster" database/migrations/0006_rule_based_seo_agents.sql
          grep -q "NOTIFY pgrst" database/migrations/0006_rule_based_seo_agents.sql
          grep -q "provider_registry_available_requires_verified_free_commercial" database/migrations/0007_provider_cost_and_studio_agents.sql
          grep -q "campaign-planner" database/migrations/0007_provider_cost_and_studio_agents.sql
      - name: Smoke test Neon Auth, Data API, and RLS
        env:
          VITE_NEON_AUTH_URL: https://ep-little-field-aomzop7h.neonauth.c-2.ap-southeast-1.aws.neon.tech/neondb/auth
          VITE_NEON_DATA_API_URL: https://ep-little-field-aomzop7h.apirest.c-2.ap-southeast-1.aws.neon.tech/neondb/rest/v1
        run: node scripts/smoke-neon-auth.mjs
      - name: Smoke test Neon development function
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 https://br-morning-recipe-aov26ci2-health.compute.c-2.ap-southeast-1.aws.neon.tech/health | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.ok!==true)process.exit(1);console.log('Neon function health:',j.status)})"
      - name: Check public SEO routes are not exposing app-only paths
        run: |
          grep -q 'Sitemap: https://yudi8377.github.io/AFFILIATE-CONTENT-MANAGEMENT-OS/sitemap.xml' robots.txt
          grep -q 'AFFILIATE-CONTENT-MANAGEMENT-OS/' sitemap.xml
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps
      - name: Assemble public artifact without repository docs or migrations
        env:
          VITE_NEON_AUTH_URL: https://ep-silent-shadow-ao76zug4.neonauth.c-2.ap-southeast-1.aws.neon.tech/neondb/auth
          VITE_NEON_DATA_API_URL: https://ep-silent-shadow-ao76zug4.apirest.c-2.ap-southeast-1.aws.neon.tech/neondb/rest/v1
        run: |
          npm run build
          cp robots.txt sitemap.xml dist/
      - name: Smoke test production Neon function
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 https://br-noisy-snow-aoosguyk-health.compute.c-2.ap-southeast-1.aws.neon.tech/health | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.ok!==true)process.exit(1);console.log('Production Neon function health:',j.status)})"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
